<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" aria-labelledby="title desc" role="img">
  <title id="title">Cielo con bandera de Israel</title>
  <desc id="desc">Fondo de cielo con degradado y nubes suaves detrás de una bandera de Israel.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff0ff"/>
      <stop offset="100%" stop-color="#82b3e6"/>
    </linearGradient>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="600" fill="url(#sky)"/>
  <g opacity="0.75">
    <circle cx="220" cy="170" r="160" fill="url(#cloud)"/>
    <circle cx="420" cy="140" r="140" fill="url(#cloud)"/>
    <circle cx="620" cy="180" r="160" fill="url(#cloud)"/>
    <circle cx="1080" cy="190" r="170" fill="url(#cloud)"/>
    <circle cx="900" cy="150" r="150" fill="url(#cloud)"/>
    <circle cx="1240" cy="170" r="130" fill="url(#cloud)"/>
  </g>
  <image href="israel-flag-waving.svg" x="170" y="180" height="260" width="1100" preserveAspectRatio="xMidYMid slice"/>
</svg>
